name: trajectory-shipper

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "VERSION"
      - "Makefile"
      - ".github/workflows/trajectory-shipper.yml"
  # Required checks must be reported for every PR. Filtering the entire workflow
  # leaves unmatched PRs permanently waiting for statuses that can never arrive.
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - run: make check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: make tidy
      - run: make build

  perf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHIPPER_PERF_RESULTS: ${{ github.workspace }}/perf-results.ndjson
      SHIPPER_PERF_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Compile while pulling the pinned test images
        run: |
          docker pull -q pgsty/silo:RELEASE.2026-09-03T13-18-01Z & minio=$!
          docker pull -q ghcr.io/shopify/toxiproxy:2.12.0 & toxiproxy=$!
          (cd src && go test -tags perf -c -o /dev/null ./perf/)
          wait $minio
          wait $toxiproxy
      - name: Run performance smoke tests
        run: make perf-smoke
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-smoke-results
          path: perf-results.ndjson
          if-no-files-found: warn
          retention-days: 30

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - run: git config --system core.longpaths true
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - run: go test ./...
        working-directory: src
      - name: Build and exercise the per-user installer
        shell: pwsh
        run: |
          $version = (sh scripts/release-version.sh).Trim()
          if ($LASTEXITCODE -ne 0) { throw "could not compute release version" }
          New-Item -ItemType Directory -Force bin/dist | Out-Null
          Push-Location src
          go build -trimpath -ldflags "-X github.com/QuesmaOrg/quesma-shipper/internal/platform.releaseVersion=$version" `
            -o ../bin/dist/quesma-shipper-windows-amd64.exe ./cmd/quesma-shipper
          go build -trimpath -ldflags "-s -w -H windowsgui" `
            -o ../bin/dist/quesma-shipper-windows-amd64-supervisor.exe ./cmd/quesma-shipper-supervisor
          Pop-Location
          src/packaging/windows/build-setup.ps1 -ReleaseVersion $version -Architecture amd64 `
            -BinaryPath bin/dist/quesma-shipper-windows-amd64.exe `
            -SupervisorPath bin/dist/quesma-shipper-windows-amd64-supervisor.exe -OutputDir bin/dist
          $setup = (Resolve-Path bin/dist/QuesmaShipperSetup-amd64.exe).Path
          $setupLog = "$env:RUNNER_TEMP\quesma-setup.log"
          $app = "$env:LOCALAPPDATA\Programs\Quesma Shipper"
          function Fail($why) {
            if (Test-Path $setupLog) { Get-Content $setupLog }
            & "$app\quesma-shipper.exe" postinstall
            throw "${why}; direct postinstall exited $LASTEXITCODE"
          }
          $setupProcess = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList `
            @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$setupLog")
          if ($setupProcess.ExitCode -ne 0) {
            if (Test-Path $setupLog) { Get-Content $setupLog }
            throw "installer exited $($setupProcess.ExitCode)"
          }
          # Registration is not liveness: assert both processes and the redirected logs.
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $supervisor = Get-Process quesma-shipper-supervisor -ErrorAction SilentlyContinue
            $shipper = Get-Process quesma-shipper -ErrorAction SilentlyContinue
            if ($supervisor -and $shipper) { break }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)
          if (-not $supervisor -or -not $shipper) {
            Fail "task did not become live (supervisor=$([bool]$supervisor), shipper=$([bool]$shipper))"
          }
          $logDir = "$env:USERPROFILE\.local\state\trajectory-shipper\logs"
          if (-not (Test-Path "$logDir\agent.err.log")) {
            throw "supervisor did not redirect the shipper's output into $logDir"
          }
          # The task name carries the installing user's SID, so two accounts cannot collide.
          $sid = ([System.Security.Principal.WindowsIdentity]::GetCurrent()).User.Value
          $taskName = "\Quesma Shipper - $sid"
          schtasks /Query /TN $taskName | Out-Null
          if ($LASTEXITCODE -ne 0) { Fail "scheduled task was not installed" }
          $uninstallProcess = Start-Process -FilePath "$app\unins000.exe" -Wait -PassThru -ArgumentList `
            @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
          if ($uninstallProcess.ExitCode -ne 0) { throw "uninstaller exited $($uninstallProcess.ExitCode)" }
          schtasks /Query /TN $taskName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "scheduled task survived uninstall" }
          $global:LASTEXITCODE = 0

  macos-package:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      # Without this the unit suite never runs on darwin, where path and service handling differ most.
      - run: go test ./...
        working-directory: src
      - name: Build and inspect the rootless package
        run: |
          version="$(sh scripts/release-version.sh)"
          make macos-pkg RELEASE_VERSION="$version"
          pkg="$PWD/bin/dist/quesma-shipper-macos-universal.pkg"
          pkgutil --payload-files "$pkg" | grep -q 'Applications/Quesma Shipper.app/Contents/MacOS/quesma-shipper'
          pkgutil --payload-files "$pkg" | grep -q '.local/bin/quesma-shipper'
          (cd src && QUESMA_SHIPPER_PKG="$pkg" \
            QUESMA_SHIPPER_RELEASE_VERSION="$version" go test ./packaging/macos/ -run BuiltPackage -v)
      - name: Install, upgrade, and remove the Homebrew cask
        run: bash scripts/test-homebrew.sh
