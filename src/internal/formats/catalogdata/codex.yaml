# Codex CLI, desktop and IDE share a rollout store with no TTL deletion.
spec_version: 1
family: codex
display_name: Codex

sources:
  - id: codex-rollouts
    description: >-
      Live rollouts under sessions/<YYYY>/<MM>/<DD>/ plus the flat archived_sessions/
      tree. Append-only with per-item flush; the writer repairs a truncated last
      line on reopen, which is a drift signal here and never a reason to fix a tail
      client-side.
    gather: file_glob
    artifact_class: trajectory
    roots: &codex_roots
      - $CODEX_HOME
      - ~/.codex
    require_subdir: sessions
    # Real rollouts reached 367 MB; this cap admits them but may hold ~2 GB until collection streams.
    max_file_bytes: 536870912
    include:
      - "sessions/**/*.jsonl"
      - "archived_sessions/**/*.jsonl"
      - "session_index.jsonl"
    sniff:
      kind: jsonl
      max_scan_bytes: 65536

  - id: codex-rollouts-compressed
    description: >-
      Cold rollouts: a background worker zstd-compresses rollouts older than about
      a week, so the same session can exist as .jsonl and later only as .jsonl.zst.
      Shipped once by whole-file hash; a moved path with an identical hash is
      dedupe, not a re-ship. Treat compression replacing a plaintext rollout as
      rename-plus-replace, never deletion.
    gather: compressed_file
    artifact_class: trajectory
    roots: *codex_roots
    require_subdir: sessions
    include:
      - "sessions/**/*.jsonl.zst"
      - "archived_sessions/**/*.jsonl.zst"
    sniff:
      kind: magic
      magic_hex: "28b52ffd"

  - id: codex-account
    description: Account and raw provider usage snapshots each collection interval.
    gather: account
    scrub: false
    roots: *codex_roots
    artifact_class: context
    max_file_bytes: 8388608
    emit: account
    sniff:
      kind: jsonl
