# Cursor transcripts omit tool results and timestamps; the enricher supplies those from state.vscdb.
# Database rows never ship directly, and the SQLite reader excludes authentication material.
spec_version: 1
family: cursor
display_name: Cursor

sources:
  - id: cursor-transcripts
    description: >-
      Native agent transcripts, including one nested subagent file per Task call.
      Writes are not atomic — the vendor confirms a transcript can end up empty or
      lost if the machine reboots mid-write — so empty and truncated tails are
      expected and ship byte-exact. Coverage is not universal either: conversations
      predating the transcript feature exist only in the database.
    gather: file_glob
    artifact_class: trajectory
    roots: &cursor_roots
      - $CURSOR_PROJECTS_DIR
      - ~/.cursor/projects
    # Bound what a corrupt or unexpectedly large transcript can make the pipeline hold.
    max_file_bytes: 268435456
    include:
      - "**/agent-transcripts/**/*.jsonl"
    enrichers:
      cursor-transcript-join: true
    sniff:
      kind: jsonl
      max_scan_bytes: 65536

  - id: cursor-agent-outputs
    description: >-
      Siblings the transcript points at rather than inlines: spilled large tool
      output, terminal captures, and the shared agent scratchpad. Collected as
      context artifacts. The vendor's own managed .gitignore block re-allows exactly
      these paths as durable artifacts, which makes drift here visible as a diff in
      a file Cursor ships.
    gather: file_glob
    artifact_class: context
    roots: *cursor_roots
    include:
      - "**/agent-tools/**"
      - "**/terminals/**"
      - "**/agent-notes/**"
    exclude:
      - "**/canvases/**"
    max_file_bytes: 8388608
    sniff:
      kind: none

  - id: cursor-account
    description: Account and raw provider usage snapshots each collection interval.
    gather: account
    scrub: false
    roots:
      - ~/Library/Application Support/Cursor/User/globalStorage
      - $APPDATA/Cursor/User/globalStorage
      - $XDG_CONFIG_HOME/Cursor/User/globalStorage
      - ~/.config/Cursor/User/globalStorage
      - ~/.config/cursor/User/globalStorage
    artifact_class: context
    max_file_bytes: 8388608
    emit: account
    sniff:
      kind: jsonl
